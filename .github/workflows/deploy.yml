name: Deploy

on:
  push:
    branches: [main]
    # Alleen documentatie gewijzigd? Dan geen bouw en uitrol (audit INF-08).
    paths-ignore: ['**.md', 'docs/**', '.github/dependabot.yml']
  workflow_dispatch:

# Bouwen en uitrollen staan centraal in ctf-ui (hard falen bij een ontbrekend
# secret of een lege build, vaste hostsleutel, npm zonder install-scripts).
# De sleutel is van deze site alleen en kan op de server enkel in de eigen map
# schrijven (rrsync; audit INF-01).
jobs:
  deploy:
    uses: LdeGroen/ctf-ui/.github/workflows/deploy-site.yml@deploy-v4
    with:
      lint: true
      beperkte-sleutel: true
    secrets:
      SSH_KEY: ${{ secrets.NIEUWE_SERVER_KEY }}
      SSH_USER: ${{ secrets.NIEUWE_SERVER_USER }}
      DOEL_PAD: ${{ secrets.NIEUWE_SERVER_PAD }}
